project_name: "Phase 2 Demo Anime"
script: script.txt
preset: preview
language: vi-VN
subtitle_language: vi
render_engine: BLENDER_EEVEE
render_device: AUTO
output:
  width: 1280
  height: 720
  fps: 24
maximum_video_duration: 30
maximum_allowed_cost: 0
asset_library_paths:
  - assets
preferred_environment: school_rooftop
music_volume: 0.20
dialogue_volume: 1.0
screenplay:
  analyzer: rules
  ollama_endpoint: http://127.0.0.1:11434
  ollama_model: qwen2.5:3b
phase2:
  enabled: true
  piper_data_dir: ../../tools/piper_voices
  rhubarb_executable: ../../tools/rhubarb/rhubarb.exe
  rhubarb_recognizer: phonetic
  default_voice: vi_female_01
  silence_before_seconds: 0.08
  silence_after_seconds: 0.12
  dialogue_gap_seconds: 0.08
  normalization_peak: 0.92
  voices:
    vi_female_01:
      model: vi_VN-vais1000-medium
      length_scale: 1.0
    vi_male_01:
      model: vi_VN-vais1000-medium
      length_scale: 1.12
  mouth_morph_mapping:
    A: closed
    B: I
    C: E
    D: A
    E: O
    F: U
    G: closed
    H: E
    X: neutral
phase3:
  enabled: true
  base_scene: blender_scenes/demo_mannequins.blend
  output_scene: blender_scenes/phase3_assembled.blend
  preview_video: renders/phase3_preview.mp4
  resolution_percentage: 50
  camera:
    close_up_distance: 4.2
    medium_distance: 6.4
    wide_distance: 8.6
phase4:
  enabled: true
  input_video: renders/phase3_preview.mp4
  subtitle_file: subtitles/dialogue_vi.srt
  output_video: output/final_video.mp4
  subtitle_mode: auto
  include_speaker_names: false
  subtitle_language_code: vie
  subtitle_style: FontName=Arial,FontSize=22,Outline=2,Shadow=0,MarginV=24,Alignment=2
  video_codec: libx264
  video_preset: medium
  crf: 20
  audio_codec: aac
  audio_bitrate: 192k
  loudness_target_lufs: -16
  true_peak_db: -1.5
  loudness_range_lu: 11
phase5:
  enabled: true
  report: generated/production_report.json
  max_asset_warnings: 0
  max_unresolved_motion_assignments: 0
  max_timing_warnings: 0
  min_output_size_bytes: 1024
  duration_tolerance_seconds: 0.25
characters:
  Aiko:
    model_id: aiko_demo
    voice_id: vi_female_01
    character_type: humanoid
    skeleton: mmd_standard
  Ren:
    model_id: ren_demo
    voice_id: vi_male_01
    character_type: humanoid
    skeleton: mmd_standard
motion_fallbacks:
  sad_talking: [idle_talking, idle]
  surprised_talking: [surprised, idle_talking, idle]
